title: Oracle Cloud Migrations Prerequisites
description: Creates the prerequisite IAM policies, dynamic groups, compartments, and tags required by Oracle Cloud Migrations. Run this stack before using migration features in the OCI Console. See https://docs.oracle.com/en-us/iaas/Content/cloud-migration/cloud-migration-get-started.htm
schemaVersion: 1.1.0
version: "20190304"
variableGroups:
  - title: "Global Resources"
    variables:
      - ${primary_prerequisite_stack}
  - title: "Enabled Migrations"
    visible: primary_prerequisite_stack
    variables:
      - ${enabled_migration_scenario}
      - ${add_vmware_to_oci}
      - ${add_vmware_to_olvm}
      - ${add_aws_to_oci}
  - title: "Replication Location"
    variables:
      - ${replication_bucket}
      - ${create_replication_bucket}
  - title: "Optional Resources"
    visible: primary_prerequisite_stack
    variables: 
      - ${migration_groups}
      - ${remote_agent_logging}
      - ${hydration_agent_logging}
  - title: "Remote Agent Appliance Logging"
    visible: 
      and: 
        - remote_agent_logging
        - primary_prerequisite_stack
    variables:
      - ${ocb-service-tenancy-ocid}
  - title: "Hydration Agent Logging"
    visible: 
      and:
        - hydration_agent_logging
        - primary_prerequisite_stack
    variables:
      - ${ocm-service-tenancy-ocid}
  - title: "Advanced Configuration"
    variables:
      - ${compartment_ocid}
  - title: "Hidden"
    visible: false
    variables: 
      - ${tenancy_ocid}
      - ${create_cloud_migrations_tag_namespace_and_tag_definitions}
variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    description: "<em>Advanced option.</em> The parent compartment where the <strong>Migration</strong> and <strong>MigrationSecrets</strong> working compartments will be created or reused. <strong>Recommended:</strong> leave this aligned with the compartment where you create the stack unless you intentionally want Oracle Cloud Migrations working compartments created somewhere else."
    title: "Migration Root Compartment"
    required: true
  create_replication_bucket:
    type: boolean
    description: "Create the Object Storage bucket used for Oracle Cloud Migrations replication data. <strong>Leave this enabled</strong> for the default setup, or disable it only when you want to reuse an existing bucket named below."
    title: "Create a new replication bucket?"
    required: true
    default: true
  replication_bucket:
    type: string
    description: "Name of the Object Storage bucket to create or reuse for <strong>Oracle Cloud Migrations replication data</strong>."
    title: "Replication Bucket Name"
    required: false
  primary_prerequisite_stack:
    type: boolean
    description: "Leave enabled for the <strong>first prerequisite stack</strong> in a tenancy so shared IAM policies, dynamic groups, and tags are created. Uncheck only when those global resources already exist and this run should reuse them."
    title: "Primary Prerequisite Stack"
    required: true
    default: true
  enabled_migration_scenario:
    type: enum
    description: "Select the primary migration scenario enabled by this prerequisite stack. Additional scenarios can be enabled below."
    title: "Enabled Migration Scenario"
    required: true
    visible: primary_prerequisite_stack
    enum:
      - "VMware to OCI"
      - "VMware to OLVM"
      - "AWS to OCI"
  add_vmware_to_oci:
    type: boolean
    description: "Also enable VMware to OCI prerequisites in addition to the primary scenario selected above."
    title: "VMware to OCI"
    required: false
    default: false
    visible:
      and:
        - primary_prerequisite_stack
        - not:
          - eq:
            - enabled_migration_scenario
            - "VMware to OCI"
        - not:
          - eq:
            - enabled_migration_scenario
            - ""
  add_vmware_to_olvm:
    type: boolean
    description: "Also enable VMware to OLVM prerequisites in addition to the primary scenario selected above."
    title: "VMware to OLVM"
    required: false
    default: false
    visible:
      and:
        - primary_prerequisite_stack
        - not:
          - eq:
            - enabled_migration_scenario
            - "VMware to OLVM"
        - not:
          - eq:
            - enabled_migration_scenario
            - ""
  add_aws_to_oci:
    type: boolean
    description: "Also enable AWS to OCI prerequisites in addition to the primary scenario selected above."
    title: "AWS to OCI"
    required: false
    default: false
    visible:
      and:
        - primary_prerequisite_stack
        - not:
          - eq:
            - enabled_migration_scenario
            - "AWS to OCI"
        - not:
          - eq:
            - enabled_migration_scenario
            - ""
  migration_groups:
    type: boolean
    description: "Create example IAM groups and policies for <strong>migration administrators</strong> and <strong>migration operators</strong> in addition to the core service prerequisites."
    title: "Migration Service User Groups"
    required: false
    default: false
  remote_agent_logging:
    type: boolean
    description: "Create cross-tenancy policies that allow <strong>Remote Agent Appliances</strong> used in VMware-based migrations to upload service logs."
    title: "Enable Remote Agent Appliance logging"
    required: false
    default: false
    visible:
      or:
        - eq:
            - enabled_migration_scenario
            - "VMware to OCI"
        - eq:
            - enabled_migration_scenario
            - "VMware to OLVM"
        - add_vmware_to_oci
        - add_vmware_to_olvm
  hydration_agent_logging:
    type: boolean
    description: "Create cross-tenancy policies that allow <strong>Hydration Agents</strong> used in migration-to-OCI workflows to upload service logs."
    title: "Enable Hydration Agent logging"
    required: false
    default: false
    visible:
      or:
        - eq:
            - enabled_migration_scenario
            - "VMware to OCI"
        - eq:
            - enabled_migration_scenario
            - "AWS to OCI"
        - add_vmware_to_oci
        - add_aws_to_oci
  ocb-service-tenancy-ocid:
    type: string
    description: "Optional Oracle Cloud Bridge service tenancy OCID override used by the Remote Agent Appliance logging policy. Leave blank in OC1; provide the realm-specific value when enabling this logging policy in another realm."
    title: "Oracle Cloud Bridge service tenancy"
    required: false
    default: ""
  ocm-service-tenancy-ocid:
    type: string
    description: "Optional Oracle Cloud Migrations service tenancy OCID override used by the Hydration Agent logging policy. Leave blank in OC1; provide the realm-specific value when enabling this logging policy in another realm."
    title: "Oracle Cloud Migrations service tenancy"
    required: false
    default: ""
